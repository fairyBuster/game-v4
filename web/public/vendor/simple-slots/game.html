<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Games</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="loading-screen.css">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        /* Portal toast: wallet errors (saldo kurang / portal down) shown over the canvas */
        #portalMsg {
            position: fixed; left: 50%; top: 22px; transform: translateX(-50%);
            padding: 10px 20px; border-radius: 10px; z-index: 99;
            background: rgba(12, 6, 4, .9); border: 1px solid #ffcc00; color: #ffcc00;
            font: 600 16px/1.3 Arial, sans-serif; text-align: center; max-width: 70%;
            opacity: 0; transition: opacity .25s; pointer-events: none;
        }
        #portalMsg.on { opacity: 1; }
    </style>
</head>

<body> <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-text">Loading</div>
        </div>
    </div>

    <div id="portalMsg"></div>

    <div class="game-container">
        <div class="game-area">
            <div class="canvas-container">
                <canvas id="gameCanvas" width="800" height="600"></canvas>
            </div>
        </div>
    </div>

    <script type="module" src="game.js"></script>

</body>

</html>
